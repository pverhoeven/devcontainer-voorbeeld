spring:
  application:
    name: bestellingen-app
  # Alle verbindingsgegevens zijn via environment variabelen te overschrijven.
  # De defaults passen bij de devcontainer: Postgres is daar localhost:5432 (.devcontainer/compose.yaml).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bestellingen}
    username: ${DB_USER:bestellingen}
    password: ${DB_PASSWORD:bestellingen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
